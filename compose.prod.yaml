# Production-like images: release binary + nginx serving the static front end + Postgres.
#   docker compose -f compose.prod.yaml up --build
#   app: http://localhost:3000   (nginx proxies /api to the backend)
# A local stand-in for production (the real one is on Render: see render.yaml). POSTGRES_PASSWORD must be set.
# Sign-in needs PUBLIC_URL (where browsers reach the site) and SMTP_URL (a real mail server);
# without SMTP_URL the sign-in links are only printed to the API log. See .env.example.
name: lilanaya-prod

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: lilanaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD (in the environment or a .env file)}
      POSTGRES_DB: lilanaya
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lilanaya -d lilanaya"]
      interval: 2s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/app/api/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgres://lilanaya:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/lilanaya
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Lilanaya <no-reply@lilanaya.local>}
      # Sign-in through Google, Apple, Facebook, GitHub. Each has its own flag and is off unless the flag is "on";
      # a provider that is on needs all of its settings.
      GOOGLE_SIGN_IN: ${GOOGLE_SIGN_IN:-}
      APPLE_SIGN_IN: ${APPLE_SIGN_IN:-}
      FACEBOOK_SIGN_IN: ${FACEBOOK_SIGN_IN:-}
      GITHUB_SIGN_IN: ${GITHUB_SIGN_IN:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
      APPLE_KEY_ID: ${APPLE_KEY_ID:-}
      APPLE_PRIVATE_KEY: ${APPLE_PRIVATE_KEY:-}
      FACEBOOK_CLIENT_ID: ${FACEBOOK_CLIENT_ID:-}
      FACEBOOK_CLIENT_SECRET: ${FACEBOOK_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Plain-English strategy compile, through Vercel AI Gateway: the language model, and Jev,
      # which screens every description before the model sees it. Leave the key unset to switch compile off.
      AI_GATEWAY_API_KEY: ${AI_GATEWAY_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_EFFORT: ${LLM_EFFORT:-}
      JEV_MODEL: ${JEV_MODEL:-}
      JEV_MIN_CONFIDENCE: ${JEV_MIN_CONFIDENCE:-}
      AI_ZERO_DATA_RETENTION: ${AI_ZERO_DATA_RETENTION:-}
      # Usage limits (defaults in src/app/api/src/config.rs).
      FREE_MONTHLY_RUNS: ${FREE_MONTHLY_RUNS:-}
      SUBSCRIBER_MONTHLY_RUNS: ${SUBSCRIBER_MONTHLY_RUNS:-}
      FREE_AI_REQUESTS_PER_WORLD: ${FREE_AI_REQUESTS_PER_WORLD:-}
      SUBSCRIBER_AI_REQUESTS_PER_MONTH: ${SUBSCRIBER_AI_REQUESTS_PER_MONTH:-}
      MAX_ACTIVE_RUNS: ${MAX_ACTIVE_RUNS:-}
      PREVIEWS_PER_HOUR: ${PREVIEWS_PER_HOUR:-}
      COMPILES_PER_HOUR: ${COMPILES_PER_HOUR:-}
      COMPILES_PER_DAY: ${COMPILES_PER_DAY:-}
      COMPILE_TOKENS_PER_DAY: ${COMPILE_TOKENS_PER_DAY:-}
      # Payment through Stripe (src/app/api/src/billing.rs). Leave the key unset to switch payment off.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_SUBSCRIPTION_PRICE: ${STRIPE_SUBSCRIPTION_PRICE:-}
      STRIPE_PACK_SMALL_PRICE: ${STRIPE_PACK_SMALL_PRICE:-}
      STRIPE_PACK_MEDIUM_PRICE: ${STRIPE_PACK_MEDIUM_PRICE:-}
      STRIPE_PACK_LARGE_PRICE: ${STRIPE_PACK_LARGE_PRICE:-}
      STRIPE_TAX: ${STRIPE_TAX:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: src/app/web/lilanaya-client
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  pgdata:
