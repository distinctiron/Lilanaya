server {
    listen 80;
    root /usr/share/nginx/html;

    # Look "api" up through Docker's DNS on each request (cached 10s) instead of once
    # at start-up, so the proxy keeps working when the api container is recreated.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        set $api http://api:8080;
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Always revalidate, so edits show up on refresh.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
