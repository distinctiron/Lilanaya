add_header Content-Security-Policy "default-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
# The emailed sign-in link carries its token in the address: never pass addresses on.
add_header Referrer-Policy "no-referrer" always;
# Browsers ignore this over plain http, so it is harmless in development.
add_header Strict-Transport-Security "max-age=31536000" always;
