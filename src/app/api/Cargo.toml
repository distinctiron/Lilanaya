[package]
name = "lilanaya-api"
edition.workspace = true
version.workspace = true

[dependencies]
axum = "0.8"
getrandom = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs"] }
lilanaya-engine = { path = "../../engine" }
object_store = { version = "0.14.2", default-features = false, features = ["aws"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
