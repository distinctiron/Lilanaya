[package]
name = "lilanaya-api"
edition.workspace = true
version.workspace = true

[dependencies]
aws-lc-rs = "1"
axum = "0.8"
base64 = "0.22"
form_urlencoded = "1"
getrandom = "0.4"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "smtp-transport", "tokio1-rustls", "aws-lc-rs", "rustls-native-certs"] }
lilanaya-engine = { path = "../../engine" }
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
rquickjs = "0.14"
serde = { version = "1", features = ["derive"] }
# float_roundtrip: a run's numbers cross from the child process as JSON and must arrive exactly as the engine made them.
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11.1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "postgres", "migrate", "macros", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal", "sync", "time", "process", "io-util"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
