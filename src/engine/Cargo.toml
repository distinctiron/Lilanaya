[package]
name = "lilanaya-engine"
edition.workspace = true
version.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }

[dev-dependencies]
# float_roundtrip, as in the API: a run read back from JSON must have exactly the numbers the engine made.
serde_json = { version = "1", features = ["float_roundtrip"] }
