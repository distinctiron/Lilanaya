# Render Blueprint: the whole production setup. In the Render dashboard: New > Blueprint,
# pick this repository; Render shows what it will create and what it costs before anything is made.
#
# Only the website is public. The API, the worker and the database are reachable from inside
# the private network only. Everything is in Frankfurt (EU).
#
# Values marked `sync: false` are secrets: Render asks for them when the Blueprint is first
# applied and they are never written in this file.

databases:
  - name: lilanaya-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    databaseName: lilanaya
    user: lilanaya
    # No address outside Render's private network may connect.
    ipAllowList: []

envVarGroups:
  # What both the API and the worker need.
  - name: lilanaya-shared
    envVars:
      # Refuse to start in a state that is only safe on a developer's machine (see main.rs).
      - key: APP_ENV
        value: production

services:
  # The website: nginx serving the static front end and passing /api on to the API.
  - type: web
    name: lilanaya-web
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./src/app/web/lilanaya-client/Dockerfile
    dockerContext: ./src/app/web/lilanaya-client
    healthCheckPath: /robots.txt
    envVars:
      - key: PORT
        value: "80"
      # Where the website finds the API on the private network: the API service's name and
      # the PORT it is given below. Written out, not taken from the service with `fromService`:
      # that value is worked out when the Blueprint is synced, from the API's settings before
      # the sync, so after a port change it stays one sync behind.
      - key: API_HOSTPORT
        value: lilanaya-api:8080

  # The API: answers requests. Not reachable from the internet.
  - type: pserv
    name: lilanaya-api
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./src/app/api/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: lilanaya-shared
      - key: ROLE
        value: api
      # The port the API listens on. Keep it the same as in API_HOSTPORT above.
      - key: PORT
        value: "8080"
      - key: DATABASE_URL
        fromDatabase:
          name: lilanaya-db
          property: connectionString
      # The https address people type to reach the site, e.g. https://lilanaya.example
      - key: PUBLIC_URL
        sync: false
      # The mail server sign-in links are sent through, e.g. smtps://resend:<key>@smtp.resend.com:465
      - key: SMTP_URL
        sync: false
      # Who sign-in emails come from, e.g. Lilanaya <no-reply@lilanaya.example>
      - key: MAIL_FROM
        sync: false
      # Sign-in through Google: an OAuth client of type "Web application" (Google Cloud console), with the
      # redirect address {PUBLIC_URL}/api/auth/google/callback. Set the flag to "on" only together with both
      # credentials: with the flag on and one of them missing the API refuses to start. Empty keeps it off.
      - key: GOOGLE_SIGN_IN
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      # Vercel AI Gateway key: the language model and the Jev screen. Leave empty to keep compile off.
      - key: AI_GATEWAY_API_KEY
        sync: false
      # Payment through Stripe (see .env.example for what to make in Stripe). Leave the key empty to keep payment off.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_SUBSCRIPTION_PRICE
        sync: false
      - key: STRIPE_PACK_SMALL_PRICE
        sync: false
      - key: STRIPE_PACK_MEDIUM_PRICE
        sync: false
      - key: STRIPE_PACK_LARGE_PRICE
        sync: false

  # The worker: runs queued simulations, one at a time, each in a child process it can stop.
  - type: worker
    name: lilanaya-worker
    runtime: docker
    region: frankfurt
    plan: starter
    dockerfilePath: ./src/app/api/Dockerfile
    dockerContext: .
    envVars:
      - fromGroup: lilanaya-shared
      - key: ROLE
        value: worker
      - key: DATABASE_URL
        fromDatabase:
          name: lilanaya-db
          property: connectionString
